<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agenda, lista — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a,input{font-family:inherit}
.m{font-family:Manrope,Inter,sans-serif}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ag{background:#E7F1FF;color:#1D4ED8}
.c-x{background:#F1F5F9;color:#475569}
.seg{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:#475569;font-size:13px;font-weight:600}
.fc{height:36px;padding:0 12px;border-radius:99px;border:1px solid #E2E8F0;background:#fff;color:#334155;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.gh{display:flex;align-items:baseline;justify-content:space-between;padding:4px 6px 0;font-size:12px;font-weight:700;color:#475569;letter-spacing:.04em;text-transform:uppercase}
.grp{background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:2px 12px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #EEF2F6;width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:#0F172A}
.row:last-child{border-bottom:0}
.tm{width:52px;flex-shrink:0}
.tm b{display:block;font-family:Manrope,Inter,sans-serif;font-size:15px;font-weight:800;color:#0F2D5B}
.tm span{font-size:11px;color:#64748B}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:14px;font-weight:600}
.nm span{display:block;font-size:12px;color:#64748B}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:11px;font-weight:600;color:#64748B;text-decoration:none}
a{color:#1D4ED8}a:hover{color:#0F2D5B}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F8FAFC;font-family:Inter,sans-serif;color:#0F172A;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="flex:1;overflow:hidden;padding:20px 16px 100px;display:flex;flex-direction:column;gap:12px">

    <h1 class="m" style="margin:0 4px;font-size:24px;font-weight:800;color:#0F2D5B">Agenda</h1>

    <div role="group" aria-label="Modo de visualização" style="display:flex;gap:2px;padding:3px;border-radius:12px;background:#EEF2F6">
      <button class="seg">Dia</button>
      <button class="seg">Semana</button>
      <button class="seg">Mês</button>
      <button class="seg" aria-pressed="true" style="background:#fff;color:#0F2D5B;box-shadow:0 1px 2px rgba(15,45,91,.12)">Lista</button>
    </div>

    <label style="position:relative;display:flex;align-items:center">
      <span class="sr">Buscar cliente ou serviço</span>
      <svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;left:14px;color:#64748B"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input type="search" placeholder="Buscar cliente ou serviço" style="height:48px;width:100%;padding:0 14px 0 42px;border:1px solid #E2E8F0;border-radius:14px;font-size:16px;background:#fff;color:#0F172A">
    </label>

    <div role="group" aria-label="Filtrar por status" style="display:flex;gap:6px;overflow:hidden;margin:0 -16px;padding:0 16px">
      <button class="fc" aria-pressed="true" style="background:#0F2D5B;border-color:#0F2D5B;color:#fff">Todos</button>
      <button class="fc"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="color:#1D4ED8"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Agendados</button>
      <button class="fc"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="color:#166534"><path d="m5 12 5 5 9-10"></path></svg>Concluídos</button>
      <button class="fc"><svg class="i" width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" style="color:#475569"><path d="M18 6 6 18M6 6l12 12"></path></svg>Cancelados</button>
    </div>

    <div class="gh"><span>Hoje · qui 29/10</span><span style="text-transform:none;letter-spacing:0;font-weight:600">4 a seguir</span></div>
    <div class="grp">
      <button class="row"><span class="tm"><b>14:00</b><span>15:00</span></span><span class="nm"><b>Juliana Rocha</b><span>Escova e hidratação</span></span><span class="chip" style="background:#0F2D5B;color:#fff">Próximo</span></button>
      <button class="row"><span class="tm"><b>15:00</b><span>16:00</span></span><span class="nm"><b>Mariana Lima</b><span>Unhas em gel</span></span><span class="chip c-ag">Agendado</span></button>
      <button class="row"><span class="tm"><b style="color:#64748B">16:30</b><span>17:00</span></span><span class="nm"><b style="color:#64748B;text-decoration:line-through">Roberto Alves</b><span>Barba</span></span><span class="chip c-x"><svg class="i" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Cancelado</span></button>
      <button class="row"><span class="tm"><b>17:00</b><span>18:00</span></span><span class="nm"><b>Fernanda Costa</b><span>Coloração</span></span><span class="chip c-ag">Agendado</span></button>
    </div>

    <div class="gh"><span>Amanhã · sex 30/10</span><span style="text-transform:none;letter-spacing:0;font-weight:600">4 atendimentos</span></div>
    <div class="grp">
      <button class="row"><span class="tm"><b>09:00</b><span>10:00</span></span><span class="nm"><b>Vanessa Torres</b><span>Manicure</span></span><span class="chip c-ag">Agendado</span></button>
      <button class="row"><span class="tm"><b>10:00</b><span>11:00</span></span><span class="nm"><b>Rafael Lima</b><span>Corte masculino</span></span><span class="chip c-ag">Agendado</span></button>
      <button class="row"><span class="tm"><b>14:00</b><span>16:00</span></span><span class="nm"><b>Larissa Campos</b><span>Mechas e corte</span></span><span class="chip c-ag">Agendado</span></button>
      <button class="row"><span class="tm"><b>17:00</b><span>18:00</span></span><span class="nm"><b>Bruna Teixeira</b><span>Pedicure</span></span><span class="chip c-ag">Agendado</span></button>
    </div>
  </div>

  <nav aria-label="Navegação principal" style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:8px 8px 0">
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Início</a>
    <a href="#" class="nv" aria-current="page" style="color:#1D4ED8"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Agenda</a>
    <div style="display:flex;justify-content:center"><button aria-label="Novo agendamento" style="width:58px;height:58px;border-radius:99px;background:#2563EB;color:#fff;border:4px solid #F8FAFC;margin-top:-26px;display:grid;place-items:center"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>Histórico</a>
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>Ajustes</a>
  </nav>
</div>
</x-dc>

</body>
</html>
