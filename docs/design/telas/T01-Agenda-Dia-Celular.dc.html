<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Agenda, dia — celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
.m{font-family:Manrope,Inter,sans-serif}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.c-ag{background:#E7F1FF;color:#1D4ED8}
.c-x{background:#F1F5F9;color:#475569}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid #E2E8F0;background:#fff;color:#0F2D5B;display:grid;place-items:center}
.seg{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:#475569;font-size:13px;font-weight:600}
.card{display:flex;align-items:center;gap:12px;padding:10px;border-radius:18px;background:#fff;border:1px solid #E2E8F0;width:100%;text-align:left;color:#0F172A}
.tp{width:62px;height:48px;border-radius:12px;background:#E7F1FF;color:#0F2D5B;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.tp b{font-family:Manrope,Inter,sans-serif;font-size:15px;font-weight:800}
.tp span{font-size:11px;color:#475569}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;font-weight:600}
.nm span{display:block;font-size:13px;color:#64748B}
.nv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:52px;font-size:11px;font-weight:600;color:#64748B;text-decoration:none}
a{color:#1D4ED8}a:hover{color:#0F2D5B}
</style>
</helmet>
<div style="width:390px;height:844px;background:#F8FAFC;font-family:Inter,sans-serif;color:#0F172A;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="flex:1;overflow:hidden;padding:20px 16px 100px;display:flex;flex-direction:column;gap:14px">

    <header style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
      <h1 class="m" style="margin:0;font-size:24px;font-weight:800;color:#0F2D5B">Agenda</h1>
      <div style="display:flex;gap:8px">
        <button class="ib" aria-label="Buscar"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
        <button style="height:44px;padding:0 14px;border-radius:14px;border:0;background:#E7F1FF;color:#0F2D5B;font-size:14px;font-weight:700">Hoje</button>
      </div>
    </header>

    <div style="display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #E2E8F0;border-radius:18px;padding:6px">
      <button class="ib" aria-label="Dia anterior" style="border:0"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <div style="text-align:center"><div style="font-size:12px;color:#64748B;font-weight:600">Quinta-feira · hoje</div><div class="m" style="font-size:18px;font-weight:800;color:#0F2D5B">29 de outubro</div></div>
      <button class="ib" aria-label="Próximo dia" style="border:0"><svg class="i" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>

    <div role="group" aria-label="Modo de visualização" style="display:flex;gap:2px;padding:3px;border-radius:12px;background:#EEF2F6">
      <button class="seg" aria-pressed="true" style="background:#fff;color:#0F2D5B;box-shadow:0 1px 2px rgba(15,45,91,.12)">Dia</button>
      <button class="seg">Semana</button>
      <button class="seg">Mês</button>
      <button class="seg">Lista</button>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px">
      <p style="margin:0;font-size:14px;color:#334155"><strong style="color:#0F2D5B">7 atendimentos</strong> · 3 horários livres</p>
      <button style="height:36px;padding:0 12px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:#0F2D5B;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px"><svg class="i" width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8.5V19l-4 2v-7.5z"></path></svg>Todos</button>
    </div>

    <button style="height:42px;border-radius:14px;border:0;background:#EEF2F6;color:#475569;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px">
      3 já realizados (08:30 – 12:00)<svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>

    <div style="display:flex;align-items:center;gap:10px;color:#64748B;font-size:12px;font-weight:600;padding:0 6px"><span>12:00 – 13:00</span><span style="flex:1;height:1px;background:#E2E8F0"></span><span>Almoço</span></div>

    <button class="card" style="border:1.5px dashed #93C5FD;background:#F5F9FF;color:#1D4ED8">
      <span class="tp" style="background:#fff;color:#1D4ED8"><b>13:00</b><span style="color:#1D4ED8">14:00</span></span>
      <span class="nm"><b>Horário livre</b><span style="color:#1D4ED8">Toque para agendar</span></span>
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>

    <div aria-label="Agora, 13:40" style="display:flex;align-items:center;gap:8px;color:#2563EB;font-size:12px;font-weight:700;padding:0 6px"><span style="width:8px;height:8px;border-radius:9px;background:#2563EB"></span>Agora · 13:40<span style="flex:1;height:2px;background:#3B82F6;border-radius:2px"></span></div>

    <button class="card" style="background:#0F2D5B;border-color:#0F2D5B;color:#fff">
      <span class="tp" style="background:rgba(255,255,255,.14);color:#fff"><b>14:00</b><span style="color:#CBD5E1">15:00</span></span>
      <span class="nm"><b>Juliana Rocha</b><span style="color:#CBD5E1">Escova e hidratação</span></span>
      <span class="chip" style="background:#fff;color:#0F2D5B">Próximo</span>
    </button>

    <button class="card">
      <span class="tp"><b>15:00</b><span>16:00</span></span>
      <span class="nm"><b>Mariana Lima</b><span>Unhas em gel</span></span>
      <span class="chip c-ag"><svg class="i" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Agendado</span>
    </button>

    <button class="card" style="border:1.5px dashed #93C5FD;background:#F5F9FF;color:#1D4ED8">
      <span class="tp" style="background:#fff;color:#1D4ED8"><b>16:00</b><span style="color:#1D4ED8">17:00</span></span>
      <span class="nm"><b>Horário livre</b><span style="color:#475569"><span style="text-decoration:line-through">Roberto Alves</span> cancelou</span></span>
      <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>

    <button class="card">
      <span class="tp"><b>17:00</b><span>18:00</span></span>
      <span class="nm"><b>Fernanda Costa</b><span>Coloração</span></span>
      <span class="chip c-ag"><svg class="i" width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Agendado</span>
    </button>
  </div>

  <nav aria-label="Navegação principal" style="position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;padding:8px 8px 0">
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>Início</a>
    <a href="#" class="nv" aria-current="page" style="color:#1D4ED8"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>Agenda</a>
    <div style="display:flex;justify-content:center"><button aria-label="Novo agendamento" style="width:58px;height:58px;border-radius:99px;background:#2563EB;color:#fff;border:4px solid #F8FAFC;margin-top:-26px;display:grid;place-items:center"><svg class="i" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>Histórico</a>
    <a href="#" class="nv"><svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>Ajustes</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
