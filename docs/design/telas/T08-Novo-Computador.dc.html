<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novo agendamento com conflito — computador</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a,input,textarea,select{font-family:inherit}
.m{font-family:Manrope,Inter,sans-serif}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.lb{display:block;font-size:13px;font-weight:600;color:#334155;margin-bottom:6px}
.lb small{font-weight:500;color:#64748B}
.in{width:100%;height:44px;border:1px solid #CBD5E1;border-radius:10px;padding:0 12px;font-size:15px;color:#0F172A;background:#fff}
.sv{height:36px;padding:0 12px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:#334155;font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.sv span{font-weight:500;color:#64748B}
.fs{height:40px;padding:0 12px;border-radius:10px;border:1.5px dashed #93C5FD;background:#F5F9FF;color:#1D4ED8;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;width:100%}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid #E2E8F0;background:#fff;color:#0F2D5B;font-size:14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a{color:#1D4ED8}a:hover{color:#0F2D5B}
</style>
</helmet>
<div style="min-height:900px;position:relative;background:#F8FAFC;font-family:Inter,sans-serif;color:#0F172A;display:flex;flex-wrap:wrap">
  <div aria-hidden="true" style="flex:1 1 96px;background:#fff;border-right:1px solid #E2E8F0"></div>
  <div aria-hidden="true" style="flex:999 1 560px;padding:32px 36px;display:flex;flex-direction:column;gap:20px">
    <div style="height:56px;width:300px;border-radius:12px;background:#E2E8F0"></div>
    <div style="height:64px;border-radius:18px;background:#fff;border:1px solid #E2E8F0"></div>
    <div style="height:600px;border-radius:18px;background:#fff;border:1px solid #E2E8F0"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(15,23,42,.45)"></div>

  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px">
    <section role="dialog" aria-modal="true" aria-labelledby="t8h" style="width:100%;max-width:860px;background:#fff;border-radius:22px;box-shadow:0 24px 60px rgba(15,23,42,.25);display:flex;flex-direction:column;overflow:hidden">
      <header style="display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid #EEF2F6">
        <h2 id="t8h" class="m" style="margin:0;font-size:22px;font-weight:800;color:#0F2D5B">Novo agendamento</h2>
        <button aria-label="Fechar" style="width:40px;height:40px;border:0;border-radius:10px;background:#F1F5F9;color:#475569;display:grid;place-items:center"><svg class="i" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </header>

      <div style="display:flex;flex-wrap:wrap">
        <form style="flex:999 1 420px;padding:22px 24px;display:flex;flex-direction:column;gap:16px">
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
            <label><span class="lb">Nome do cliente</span><input class="in" value="Patrícia Alves"></label>
            <label><span class="lb">Telefone <small>(opcional)</small></span><input class="in" placeholder="(11) 90000-0000"></label>
          </div>
          <fieldset style="border:0;margin:0;padding:0">
            <legend class="lb">Serviço</legend>
            <div style="display:flex;flex-wrap:wrap;gap:8px">
              <button type="button" class="sv">Manicure <span>45 min</span></button>
              <button type="button" class="sv" aria-pressed="true" style="background:#0F2D5B;border-color:#0F2D5B;color:#fff">Escova <span style="color:#CBD5E1">1h</span></button>
              <button type="button" class="sv">Coloração <span>1h30</span></button>
              <button type="button" class="sv" style="border-style:dashed;color:#1D4ED8">+ Outro</button>
            </div>
          </fieldset>
          <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end">
            <label><span class="lb">Data</span><input class="in" value="29/10/2026"></label>
            <label><span class="lb">Início</span><input class="in" value="14:30" aria-invalid="true" aria-describedby="t8err" style="border:2px solid #DC2626"></label>
            <label><span class="lb">Duração</span><select class="in"><option>1 hora</option></select></label>
            <div style="height:44px;border-radius:10px;background:#F8FAFC;border:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;padding:0 12px"><span style="font-size:12px;color:#64748B">Fim</span><span class="m" style="font-weight:800;color:#0F2D5B">15:30</span></div>
          </div>

          <div id="t8err" role="alert" style="display:flex;gap:12px;padding:14px 16px;border-radius:14px;background:#FEF2F2;border:1px solid #FECACA;color:#991B1B">
            <svg class="i" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
            <div style="font-size:14px;line-height:1.45"><strong style="display:block">Esse horário já está ocupado</strong>14:30–15:30 conflita com <b>Juliana Rocha (14:00–15:00)</b> e <b>Mariana Lima (15:00–16:00)</b>. Escolha um dos horários livres ao lado.</div>
          </div>

          <label><span class="lb">Observações <small>(opcional)</small></span><textarea style="width:100%;height:70px;border:1px solid #CBD5E1;border-radius:10px;padding:10px 12px;font-size:15px;resize:none"></textarea></label>
        </form>

        <aside style="flex:1 1 260px;background:#F8FAFC;border-left:1px solid #EEF2F6;padding:22px 20px;display:flex;flex-direction:column;gap:10px">
          <h3 class="m" style="margin:0 0 4px;font-size:15px;font-weight:700;color:#0F2D5B">Livres em 29/10 para 1 hora</h3>
          <button class="fs"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>13:00 – 14:00</button>
          <button class="fs"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>16:00 – 17:00</button>
          <button class="fs"><svg class="i" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>18:00 – 19:00</button>
          <p style="margin:6px 0 0;font-size:12px;color:#64748B;line-height:1.5">Mostrando só horários dentro do seu expediente (08:00–19:00, almoço 12:00–13:00).</p>
        </aside>
      </div>

      <footer style="display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #EEF2F6">
        <button class="btn">Cancelar</button>
        <button class="btn" disabled style="background:#93C5FD;border-color:#93C5FD;color:#fff;cursor:not-allowed">Salvar agendamento</button>
      </footer>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
